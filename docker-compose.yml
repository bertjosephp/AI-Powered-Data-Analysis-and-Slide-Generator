# Local stack: `cp .env.example .env`, fill in keys (or set MOCK_EXTERNAL=true), then
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8000/api/v1 (docs at /docs)
services:
  api:
    build: ./apps/api
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        # The browser calls the API directly, so this is the host-visible URL.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
